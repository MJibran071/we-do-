    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            ringColor: {
              DEFAULT: '#6366f1',
            },
            colors: {
              gray: {
                850: '#1a1f2e',
                900: '#0f1419',
                925: '#0a0e14',
                950: '#050810',
              },
              dark: {
                bg: '#0a0e14',
                card: '#0f1419',
                border: '#1a1f2e',
                hover: '#1a1f2e',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.4s ease-out forwards',
              'slide-up': 'slideUp 0.5s ease-out forwards',
              'slide-in-right': 'slideInRight 0.3s ease-out forwards',
              'scale-in': 'scaleIn 0.2s ease-out forwards',
              'bounce-gentle': 'bounceGentle 2s infinite',
              'pulse-subtle': 'pulseSubtle 2s infinite',
              'shrink-to-top': 'shrinkToTop 0.3s ease-in forwards',
              'pop-in': 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'rotate-y-in': 'rotateYIn 0.6s ease-out forwards',
              'music-bar': 'musicBar 1s ease-in-out infinite',
              'blob': 'blob 7s infinite',
              'swing': 'swing 2s infinite',
              'marquee': 'marquee 30s linear infinite',
              'scan-down': 'scanDown 2s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(15px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideInRight: {
                '0%': { opacity: '0', transform: 'translateX(10px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              bounceGentle: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-3px)' },
              },
              pulseSubtle: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.8' },
              },
              shrinkToTop: {
                '0%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                '100%': { opacity: '0', transform: 'translateY(-20px) scale(0.9)' },
              },
              popIn: {
                '0%': { opacity: '0', transform: 'scale(0.8) translateY(10px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
              rotateYIn: {
                '0%': { opacity: '0', transform: 'perspective(1000px) rotateY(5deg) scale(0.98) translateY(10px)' },
                '100%': { opacity: '1', transform: 'perspective(1000px) rotateY(0) scale(1) translateY(0)' },
              },
              musicBar: {
                '0%, 100%': { height: '4px' },
                '50%': { height: '20px' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              swing: {
                '0%, 100%': { transform: 'rotate(0deg)' },
                '20%': { transform: 'rotate(15deg)' },
                '40%': { transform: 'rotate(-10deg)' },
                '60%': { transform: 'rotate(5deg)' },
                '80%': { transform: 'rotate(-5deg)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              scanDown: {
                '0%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(256px)' },
                '100%': { transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #94a3b8; 
      }
      
      /* Dark mode scrollbar */
      .dark ::-webkit-scrollbar-thumb {
        background-color: #1a1f2e; 
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background-color: #2a3142; 
      }
      .dark ::-webkit-scrollbar-track {
        background: #0a0e14;
      }

      /* Hide scrollbar utility */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }

      /* Dark mode enhancements */
      .dark {
        color-scheme: dark;
      }
      
      /* Improved dark mode text rendering */
      .dark body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Better dark mode selection */
      .dark ::selection {
        background-color: rgba(99, 102, 241, 0.3);
        color: #e5e7eb;
      }

      /* Subtle dark mode background pattern */
      .dark body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          radial-gradient(circle at 25% 25%, rgba(99, 102, 241, 0.03) 0%, transparent 50%),
          radial-gradient(circle at 75% 75%, rgba(139, 92, 246, 0.03) 0%, transparent 50%);
        pointer-events: none;
        z-index: 0;
      }
    </style>
